name: evently_app
description: "A new Flutter project."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_bounceable: ^1.2.0
  provider: ^6.1.5+1
  flutter_switch: ^0.3.2
  intl: ^0.20.3
  flutter_easyloading: ^4.0.2
  bot_toast: ^4.1.3
  lottie: ^3.5.1
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter_gen:
  output: lib/core/config/gen/

  # Optional
  integrations:
    image: true
    flutter_svg: true


flutter:

  uses-material-design: true

  assets:
   - assets/images/
   - assets/icons/

  fonts:
  - family: Poppins
    fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
